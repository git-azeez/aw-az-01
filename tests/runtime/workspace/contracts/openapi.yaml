openapi: 3.1.0
info:
  title: ClearLedger Settlement API
  version: 1.0.0
  description: HTTP contract for the ClearLedger clearing and settlement platform.
paths:
  /health/live:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      summary: Readiness probe
      responses:
        "200":
          description: Dependencies required for traffic are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more critical dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/settlements:
    post:
      summary: Initiate a new settlement aggregate
      security:
        - bearerAuth: ["clearledger/write"]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSettlementRequest"
      responses:
        "201":
          description: Settlement initiated and committed to the transactional store
          headers:
            X-ClearLedger-Instance:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteAcceptedResponse"
        "200":
          description: Idempotent replay of a previously committed settlement initiation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteAcceptedResponse"
        "400":
          description: Invalid request payload or missing Idempotency-Key
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Token does not include clearledger/write
        "409":
          description: Version conflict or idempotency key reused with a different payload
  /v1/settlements/{id}/entries:
    post:
      summary: Append a clearing or settlement ledger entry
      security:
        - bearerAuth: ["clearledger/write"]
      parameters:
        - $ref: "#/components/parameters/SettlementId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendEntryRequest"
      responses:
        "202":
          description: Ledger entry committed and queued for projection
          headers:
            X-ClearLedger-Instance:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteAcceptedResponse"
        "200":
          description: Idempotent replay of a previously committed ledger entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteAcceptedResponse"
        "400":
          description: Invalid payload or missing Idempotency-Key
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Token does not include clearledger/write
        "404":
          description: Settlement does not exist in the transactional store
        "409":
          description: Optimistic concurrency conflict or idempotency key mismatch
  /v1/settlements/{id}:
    get:
      summary: Read the projected state of a settlement
      security:
        - bearerAuth: ["clearledger/read"]
      parameters:
        - $ref: "#/components/parameters/SettlementId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current projected state
          headers:
            X-ClearLedger-Source:
              description: "`cache` when served from Valkey, `projection` when served from DynamoDB"
              schema:
                type: string
                enum: [cache, projection]
            X-ClearLedger-Version:
              schema:
                type: integer
            X-ClearLedger-Instance:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementProjection"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Token does not include clearledger/read
        "404":
          description: Projection not found
  /v1/settlements/{id}/ledger:
    get:
      summary: Read the ordered ledger event history of a settlement
      security:
        - bearerAuth: ["clearledger/read"]
      parameters:
        - $ref: "#/components/parameters/SettlementId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Ordered settlement ledger history from the projection store
          headers:
            X-ClearLedger-Source:
              schema:
                type: string
                enum: [projection]
            X-ClearLedger-Version:
              schema:
                type: integer
            X-ClearLedger-Instance:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementLedgerResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Token does not include clearledger/read
        "404":
          description: Projection ledger not found
  /v1/admin/projections/{id}/rebuild:
    post:
      summary: Rebuild a settlement projection from the PostgreSQL event log
      security:
        - bearerAuth: ["clearledger/admin"]
      parameters:
        - $ref: "#/components/parameters/SettlementId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "202":
          description: Events re-enqueued for projection rebuild
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebuildResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Token does not include clearledger/admin
        "404":
          description: Settlement does not exist in PostgreSQL
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SettlementId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 4
        maxLength: 128
  schemas:
    HealthResponse:
      type: object
      required: [status, service, instance, checks]
      properties:
        status:
          type: string
          enum: [UP, DEGRADED]
        service:
          type: string
        instance:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
    CreateSettlementRequest:
      type: object
      required:
        - settlementId
        - accountId
        - reference
        - debitParty
        - creditParty
        - expectedVersion
      properties:
        settlementId:
          type: string
          format: uuid
        accountId:
          type: string
          minLength: 3
          maxLength: 64
        reference:
          type: string
          minLength: 3
          maxLength: 64
        debitParty:
          type: string
          minLength: 2
          maxLength: 64
        creditParty:
          type: string
          minLength: 2
          maxLength: 64
        expectedVersion:
          type: integer
          const: 0
    AppendEntryRequest:
      type: object
      required:
        - entryId
        - status
        - clearingStage
        - occurredAt
        - expectedVersion
      properties:
        entryId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - VALIDATED
            - RESERVED
            - CLEARED
            - SETTLED
            - RECONCILED
            - DISPUTED
        clearingStage:
          type: string
          minLength: 2
          maxLength: 64
        memo:
          type: ["string", "null"]
          maxLength: 256
        occurredAt:
          type: string
          format: date-time
        expectedVersion:
          type: integer
          minimum: 1
    WriteAcceptedResponse:
      type: object
      required:
        - settlementId
        - eventId
        - version
        - accepted
        - idempotentReplay
      properties:
        settlementId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        accepted:
          type: boolean
        idempotentReplay:
          type: boolean
    SettlementProjection:
      type: object
      required:
        - settlementId
        - accountId
        - reference
        - debitParty
        - creditParty
        - status
        - clearingStage
        - version
        - entryCount
        - updatedAt
      properties:
        settlementId:
          type: string
          format: uuid
        accountId:
          type: string
        reference:
          type: string
        debitParty:
          type: string
        creditParty:
          type: string
        status:
          type: string
          enum:
            - INITIATED
            - VALIDATED
            - RESERVED
            - CLEARED
            - SETTLED
            - RECONCILED
            - DISPUTED
        clearingStage:
          type: string
        lastEntryId:
          type: ["string", "null"]
          format: uuid
        lastMemo:
          type: ["string", "null"]
        version:
          type: integer
          minimum: 1
        entryCount:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    SettlementLedgerItem:
      type: object
      required:
        - eventId
        - version
        - eventType
        - status
        - clearingStage
        - occurredAt
      properties:
        eventId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        eventType:
          type: string
          enum: [SettlementInitiated, LedgerEntryRecorded]
        entryId:
          type: ["string", "null"]
          format: uuid
        status:
          type: string
        clearingStage:
          type: string
        memo:
          type: ["string", "null"]
        occurredAt:
          type: string
          format: date-time
    SettlementLedgerResponse:
      type: object
      required: [settlementId, version, events]
      properties:
        settlementId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        events:
          type: array
          items:
            $ref: "#/components/schemas/SettlementLedgerItem"
    RebuildResponse:
      type: object
      required: [settlementId, requeued]
      properties:
        settlementId:
          type: string
          format: uuid
        requeued:
          type: integer
          minimum: 1
