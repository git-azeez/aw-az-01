services:
  main:
    build:
      context: .
      dockerfile: runtime/Dockerfile
    init: true
    user: "1001:1001"
    working_dir: /workspace
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://aws:4566
      TF_CLI_CONFIG_FILE: /etc/terraform.tfrc
    volumes:
      - shared-workspace:/workspace
    depends_on:
      runtime:
        condition: service_completed_successfully
    command: ["sleep", "infinity"]

  aws:
    image: floci/floci:1.5.33
    init: true
    environment:
      FLOCI_STORAGE_MODE: memory
      FLOCI_HOSTNAME: aws
      FLOCI_SERVICES: s3,sqs,sns,dynamodb,ssm,lambda,iam,sts,cognito-idp,rds,elasticache,ec2,ecs,elbv2,kms,logs,scheduler,events,cloudwatch,acm,secretsmanager,apigateway,stepfunctions,kinesis,ecr
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  runtime:
    build:
      context: .
      dockerfile: runtime/Dockerfile
    user: "0:0"
    environment:
      ROLE: verifier
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://aws:4566
    volumes:
      - shared-workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - aws
    entrypoint: ["/opt/clearledger/runtime.sh"]

volumes:
  shared-workspace:
