services:
  main:
    build:
      context: .
      dockerfile: runtime/Dockerfile
    init: true
    user: "0:0"
    working_dir: /workspace
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://aws:4566
      TF_CLI_CONFIG_FILE: /etc/terraform.tfrc
    networks:
      - verifier-control
    volumes:
      - shared-workspace:/workspace
    depends_on:
      aws:
        condition: service_healthy
      runtime:
        condition: service_completed_successfully
    command: ["sleep", "infinity"]

  aws:
    image: mirror.gcr.io/floci/floci:2.1.0@sha256:f5aa8c18302cedb4f2385f5c4e455b3efc77fee6bf7b6e5d1712b2817ba102db
    init: true
    environment:
      FLOCI_RUN_AS_ROOT: "true"
      FLOCI_DOCKER_DOCKER_HOST: unix:///var/run/docker.sock
      FLOCI_DOCKER_RESOURCE_NAMESPACE: ${COMPOSE_PROJECT_NAME}
      FLOCI_HOSTNAME: aws
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_STORAGE_PRUNE_VOLUMES_ON_DELETE: "true"
      FLOCI_SERVICES_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_workload
      FLOCI_SERVICES_ECS_MOCK: "false"
      FLOCI_SERVICES_ECS_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_workload
      FLOCI_SERVICES_RDS_MOCK: "false"
      FLOCI_SERVICES_RDS_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_workload
      FLOCI_SERVICES_RDS_DEFAULT_POSTGRES_IMAGE: mirror.gcr.io/library/postgres:16.6-alpine
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      FLOCI_SERVICES_RDS_PROXY_MAX_PORT: "7099"
      FLOCI_SERVICES_ELASTICACHE_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_workload
      FLOCI_SERVICES_ELASTICACHE_DEFAULT_IMAGE: mirror.gcr.io/valkey/valkey:8@sha256:495e4fecdc98ee48a20b207726caa5ab6451e0fac3642a9be10d9e70b3068df6
      FLOCI_SERVICES_ELASTICACHE_PROXY_BASE_PORT: "6379"
      FLOCI_SERVICES_ELASTICACHE_PROXY_MAX_PORT: "6399"
      FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_workload
      FLOCI_SERVICES_LAMBDA_DOCKER_HOST_OVERRIDE: aws
      FLOCI_SERVICES_LAMBDA_HOT_RELOAD_ENABLED: "false"
      FLOCI_SERVICES_LAMBDA_RUNTIME_API_BASE_PORT: "9200"
      FLOCI_SERVICES_LAMBDA_RUNTIME_API_MAX_PORT: "9299"
      FLOCI_SERVICES_SCHEDULER_ENABLED: "true"
      FLOCI_SERVICES_SCHEDULER_INVOCATION_ENABLED: "true"
      FLOCI_SERVICES_SCHEDULER_TICK_INTERVAL_SECONDS: "2"
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      verifier-control:
        aliases:
          - aws
      workload:
        aliases:
          - aws
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 2s
      timeout: 2s
      retries: 30

  runtime:
    build:
      context: .
      dockerfile: runtime/Dockerfile
    user: "0:0"
    environment:
      ROLE: verifier
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://aws:4566
    networks:
      - verifier-control
    volumes:
      - shared-workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      aws:
        condition: service_healthy
    entrypoint: ["/opt/clearledger/runtime.sh"]

volumes:
  shared-workspace:
  floci-data:

networks:
  verifier-control:
    internal: true
  workload:
    name: ${COMPOSE_PROJECT_NAME}_workload
    driver: bridge
    internal: true
